name: CI - MLflow Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib openpyxl --prefer-binary

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/artifacts/

      - name: Commit mlruns and Artifacts to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f MLProject/mlruns/
          git add MLProject/artifacts/ || true
          git diff --staged --quiet || git commit -m "auto: update mlruns and artifacts [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image with MLflow
        run: |
          # Cari path model secara dinamis — tidak bergantung pada run ID
          MODEL_PATH=$(find MLProject/mlruns -type d -name "random_forest_tuned" | head -1)
          echo "Model ditemukan di: $MODEL_PATH"

          if [ -z "$MODEL_PATH" ]; then
            echo "❌ Model tidak ditemukan di mlruns!"
            find MLProject/mlruns -type f | head -20
            exit 1
          fi

          mlflow models build-docker \
            --model-uri "$MODEL_PATH" \
            --name "chelsy2/raisin-classifier" \
            --env-manager=local

      - name: Push Docker Image to Docker Hub
        run: |
          docker push chelsy2/raisin-classifier:latest