name: CI - MLflow Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib openpyxl --prefer-binary

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/artifacts/

      # Commit mlruns + artifacts ke repo agar bisa dipakai Docker build
      - name: Commit mlruns and Artifacts to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Paksa track mlruns meski ada di .gitignore
          git add -f MLProject/mlruns/
          git add MLProject/artifacts/ || true
          git diff --staged --quiet || git commit -m "auto: update mlruns and artifacts [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image with MLflow
        run: |
          RUN_ID=$(cat MLProject/artifacts/run_id.txt)
          MODEL_URI="MLProject/mlruns/1/${RUN_ID}/artifacts/random_forest_tuned"
          echo "Building Docker image from: $MODEL_URI"
          
          # Verifikasi path ada
          ls -la MLProject/mlruns/1/${RUN_ID}/artifacts/ || echo "Artifacts folder not found!"
          
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "chelsy2/raisin-classifier" \
            --env-manager=local

      - name: Push Docker Image to Docker Hub
        run: |
          docker push chelsy2/raisin-classifier:latest