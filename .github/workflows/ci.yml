name: CI - MLflow Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib openpyxl --prefer-binary

      # 4. Jalankan MLflow Project
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      # 5. Upload artefak ke GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/artifacts/

      # 6. Commit artefak ke repository
      - name: Commit Artifacts to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ MLProject/mlruns/ || true
          git diff --staged --quiet || git commit -m "auto: update model artifacts [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Build Docker Image dari model lokal
      - name: Build Docker Image with MLflow
        run: |
          # Ambil run_id dari file
          RUN_ID=$(cat MLProject/artifacts/run_id.txt)
          echo "Building Docker image for run: $RUN_ID"
          mlflow models build-docker \
            --model-uri "MLProject/mlruns/1/$RUN_ID/artifacts/random_forest_tuned" \
            --name "chelsy2/raisin-classifier" \
            --env-manager=local

      # 9. Push Docker Image ke Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          docker push chelsy2/raisin-classifier:latest